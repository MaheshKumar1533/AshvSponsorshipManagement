{% extends 'sponsorships/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h1 class="display-4 fw-bold">Sponsor Gallery Demo</h1>
            <p class="lead text-muted">Fetching images dynamically using JavaScript fetch API</p>
            <button id="fetch-btn" class="btn btn-primary btn-lg mt-3">
                <i class="bi bi-cloud-download me-2"></i>Load Sponsors
            </button>
        </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="text-center d-none">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 text-muted">Fetching data...</p>
    </div>

    <!-- Error State -->
    <div id="error-msg" class="alert alert-danger d-none" role="alert"></div>

    <!-- Gallery Container -->
    <div id="gallery-container"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const fetchBtn = document.getElementById('fetch-btn');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('error-msg');
        const galleryContainer = document.getElementById('gallery-container');

        fetchBtn.addEventListener('click', async () => {
            // Reset states
            galleryContainer.innerHTML = '';
            errorMsg.classList.add('d-none');
            loading.classList.remove('d-none');
            fetchBtn.disabled = true;

            try {
                // Fetch data from API
                const response = await fetch('https://ashvsponsorship.pythonanywhere.com/api/sponsor-images/');

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Process and display data
                displaySponsors(data);

            } catch (error) {
                console.error('Fetch error:', error);
                errorMsg.textContent = `Failed to load sponsors: ${error.message}`;
                errorMsg.classList.remove('d-none');
            } finally {
                loading.classList.add('d-none');
                fetchBtn.disabled = false;
            }
        });

        function displaySponsors(data) {
            // Check if data is empty
            if (Object.keys(data).length === 0) {
                galleryContainer.innerHTML = '<p class="text-center text-muted">No sponsors found.</p>';
                return;
            }

            // Create gallery HTML
            let html = '';

            for (const [category, images] of Object.entries(data)) {
                html += `
                    <div class="card mb-4 border-0 bg-transparent">
                        <div class="card-header border-bottom border-secondary mb-3">
                            <h3 class="h4 mb-0 text-white">${category}</h3>
                        </div>
                        <div class="card-body">
                            <div class="row g-4">
                `;

                images.forEach(imageUrl => {
                    html += `
                        <div class="col-md-3 col-sm-6">
                            <div class="card h-100 bg-dark border-secondary shadow-sm hover-effect">
                                <div class="card-body d-flex align-items-center justify-content-center p-4">
                                    <img src="${imageUrl}" 
                                         class="img-fluid rounded" 
                                         alt="${category} Sponsor"
                                         style="max-height: 100px; object-fit: contain;">
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `
                            </div>
                        </div>
                    </div>
                `;
            }

            galleryContainer.innerHTML = html;
        }
    });

    // Add some custom styles for the demo
    const style = document.createElement('style');
    style.textContent = `
        .hover-effect {
            transition: transform 0.2s ease-in-out;
        }
        .hover-effect:hover {
            transform: translateY(-5px);
        }
    `;
    document.head.appendChild(style);
</script>
{% endblock %}
