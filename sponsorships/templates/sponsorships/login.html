{% extends 'sponsorships/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-4">
        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold bg-gradient-primary text-white"
                style="-webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; background: linear-gradient(to right, #6366f1, #8b5cf6);">
                ASHV '26</h1>
            <p class="text-muted">Sponsorship Management Portal</p>
        </div>
        <div class="card border-0 shadow-lg" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px);">
            <div class="card-body p-4">
                <h4 class="mb-4 text-center">Sign In</h4>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label text-muted small text-uppercase">{{
                            field.label }}</label>
                        <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}"
                            id="{{ field.id_for_label }}" class="form-control bg-dark text-light border-secondary" {% if
                            field.value %}value="{{ field.value }}" {% endif %}>
                        {% if field.errors %}
                        <div class="invalid-feedback d-block">
                            {{ field.errors|join:", " }}
                        </div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2">Sign In</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
